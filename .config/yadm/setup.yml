---
- name: Configure the workstation
  hosts: localhost
  connection: local
  tasks:
    - name: Set timezone to Europe/Moscow
      community.general.timezone:
        name: Europe/Moscow
      become: true

    - name: Upgrade system
      community.general.pacman:
        upgrade: true
        update_cache: true
      become: true

    - name: Install essential packages
      community.general.pacman:
        name:
          - alacritty
          - brightnessctl
          - zoxide
          - wofi
          - p7zip
          - dolphin
          - bluetui
          - base
          - base-devel
          - linux
          - linux-firmware
          - sudo
          - networkmanager
          - openssh
          - nano
          - pipewire
          - man-db
          - man-pages
          - wget
          - reflector
          - telegram-desktop
          - nano
          - pipewire
          - pavucontrol
          - dmidecode
          - inxi
          - dnsmasq
        state: latest
      become: true

    - name: Install hyprland packages
      community.general.pacman:
        name:
          - hyprland
          - hyprlock
          - hyprpaper
          - hypridle
          - sddm
          - xdg-desktop-portal-hyprland
        state: latest
      become: true

    - name: Install dev-packages
      community.general.pacman:
        name:
          - base-devel
          - git
          - gcc
          - tmux
          - fzf
          - zed
          - neovim
          - jujutsu
        state: latest
      become: true

    - name: Install network-packages
      community.general.pacman:
        name:
          - wireguard-tools
          - network-manager-applet
        state: latest
      become: true

    - name: Install eye-candy packages
      community.general.pacman:
        name:
          - zsh
          - eza
          - dunst
          - waybar
          - swww
          - ttf-hack-nerd
          - ttf-hack
          - ttf-dejavu
          - noto-fonts
        state: latest
      become: true

    - name: Install rust tools
      community.general.pacman:
        name:
          - rustup
          - rust-analyzer
          - rust-bindgen
        state: latest
      become: true

    - name: Install the stable toolchain
      ansible.builtin.command: rustup default stable
      changed_when: true

    - name: Install rust components
      ansible.builtin.command: rustup component add rust-src clippy rustfmt
      changed_when: true

    - name: Install some useful tools
      community.general.pacman:
        name:
          - cargo-binstall
          - cross
          - cargo-deny
          - cargo-edit
          - cargo-flamegraph
          - cargo-generate
          - cargo-nextest
          - cargo-watch
          - sccache
          - cargo-udeps
      become: true

    - name: Create the `aur_builder` user
      become: true
      ansible.builtin.user:
        name: aur_builder
        create_home: yes
        group: wheel

    - name: Allow the `aur_builder` user to run `sudo pacman` without a password
      become: true
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/11-install-aur_builder
        line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        create: true
        mode: 0644

    - name: Clone yay
      git:
        repo: https://aur.archlinux.org/yay-bin.git
        dest: "~/yay"
        update: true
      become: true
      become_user: aur_builder

    - name: Build and install yay
      command:
        chdir: "~/yay"
        cmd: "makepkg -sfi --noconfirm"
        creates: /usr/bin/yay
      become: true
      become_user: aur_builder

    - name: Install yay packages
      kewlfft.aur.aur:
        state: present
        use: yay
        name:
          - grimblast-git
          - zen-browser-bin
          - ttf-nerd-fonts-symbols
          - ttf-nerd-fonts-symbols-common
      become_user: aur_builder
      become: true

    - name: Extract wallpapers
      command:
        cmd: 7z x "~/.config/wallpapers/wallpapers.7z" -o"~/.config/wallpapers/" -y
        creates: "~/.config/wallpapers/Jill.jpg"

    - name: Check if Oh My Zsh is already installed
      stat:
        path: "~/.oh-my-zsh"
      register: oh_my_zsh_dir

    - name: Install Oh My Zsh
      shell: |
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      when: not oh_my_zsh_dir.stat.exists
      register: oh_my_zsh_install

    - name: Set Zsh as default shell for the user
      user:
        name: "{{ ansible_user_id }}"
        shell: /bin/zsh
      when: oh_my_zsh_install.changed

    - name: Enable sddm
      ansible.builtin.systemd:
        name: sddm
        state: started
        enabled: true
      become: true
